<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CurioVault 管理后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-heading">
      <span class="topbar-brand">CurioVault</span>
      <span class="topbar-divider"></span>
      <span class="topbar-title">收藏管理后台</span>
    </div>
    <div class="topbar-actions">
      <button class="tb-btn" id="btnImport" type="button">
        <i class="fa-solid fa-file-import" aria-hidden="true"></i>
        <span>导入</span>
      </button>
      <button class="tb-btn" id="btnExport" type="button">
        <i class="fa-solid fa-file-export" aria-hidden="true"></i>
        <span>导出</span>
      </button>
      <button class="tb-btn tb-btn-primary" id="btnAdd" type="button">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        <span>添加作品</span>
      </button>
    </div>
  </header>

  <main class="main-content">
    <section class="dashboard-head" aria-label="管理概览">
      <h1>收藏作品</h1>
      <p class="dashboard-note" id="dashboardNote">UI 原型模式，数据暂未连接</p>
    </section>

    <section class="stats-strip" aria-label="收藏统计">
      <div class="stat-total">
        <strong class="stat-value" id="statTotal">0</strong>
        <span class="stat-label"><i class="fa-solid fa-layer-group" aria-hidden="true"></i>总收藏</span>
      </div>
      <div class="stat-breakdown" aria-label="分类数量">
        <span class="stat-pill"><strong id="statMusic">0</strong><span>音乐</span></span>
        <span class="stat-pill"><strong id="statMovie">0</strong><span>电影</span></span>
        <span class="stat-pill"><strong id="statTv">0</strong><span>电视剧</span></span>
        <span class="stat-pill"><strong id="statBooks">0</strong><span>书籍</span></span>
        <span class="stat-pill"><strong id="statImages">0</strong><span>图片</span></span>
        <span class="stat-pill"><strong id="statArticles">0</strong><span>文章</span></span>
      </div>
      <div class="stat-latest">
        <strong id="statLatest">-</strong>
        <span class="stat-label">最近添加</span>
      </div>
    </section>

    <section class="health-panel" aria-label="连接健康">
      <div class="health-row">
        <h2 class="health-title">连接健康</h2>
        <article class="health-item" id="healthFirestore" data-health-state="checking">
          <span class="health-name">Firestore</span>
          <span class="health-chip" id="healthFirestoreStatus"><i></i>检查中</span>
          <p id="healthFirestoreMsg">正在检查数据库连接...</p>
        </article>
        <article class="health-item" id="healthData" data-health-state="checking">
          <span class="health-name">数据结构</span>
          <span class="health-chip" id="healthDataStatus"><i></i>检查中</span>
          <p id="healthDataMsg">正在检查 items 字段和分类...</p>
        </article>
        <article class="health-item" id="healthFrontend" data-health-state="checking">
          <span class="health-name">前台读取</span>
          <span class="health-chip" id="healthFrontendStatus"><i></i>检查中</span>
          <p id="healthFrontendMsg">正在检查前台页面资源...</p>
        </article>
        <button class="health-refresh" id="btnHealthRefresh" type="button">
          <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
          <span>重新检查</span>
        </button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-toolbar">
        <nav class="cat-tabs" id="catTabs" aria-label="收藏分类">
          <button class="cat-tab active" type="button" data-cat="">全部</button>
          <button class="cat-tab" type="button" data-cat="music">音乐</button>
          <button class="cat-tab" type="button" data-cat="movie">电影</button>
          <button class="cat-tab" type="button" data-cat="tv">电视剧</button>
          <button class="cat-tab" type="button" data-cat="books">书籍</button>
          <button class="cat-tab" type="button" data-cat="images">图片</button>
          <button class="cat-tab" type="button" data-cat="articles">文章</button>
        </nav>
        <div class="toolbar-tools">
          <label class="search-box" for="searchInput">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input type="search" id="searchInput" placeholder="搜索标题、作者、描述" autocomplete="off" />
          </label>
          <button class="tool-btn" id="btnToggleBulk" type="button">
            <i class="fa-solid fa-list-check" aria-hidden="true"></i>
            <span>批量选择</span>
          </button>
        </div>
      </div>

      <div class="bulk-bar" id="bulkBar" hidden>
        <span class="bulk-status" id="bulkStatus">已选择 0 项</span>
        <div class="bulk-actions">
          <button class="bulk-btn" id="btnSelectAll" type="button">全选当前列表</button>
          <button class="bulk-btn" id="btnClearSelection" type="button">取消选择</button>
          <button class="bulk-btn bulk-btn-danger" id="btnBulkDelete" type="button" disabled>
            <i class="fa-solid fa-trash" aria-hidden="true"></i>
            <span>批量删除</span>
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="data-table" id="dataTable">
          <thead>
            <tr>
              <th class="col-select">选择</th>
              <th class="col-cover">封面</th>
              <th class="col-title">标题</th>
              <th class="col-cat">类别</th>
              <th class="col-year">年份</th>
              <th class="col-rating">推荐</th>
              <th class="col-time">添加时间</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8" class="table-empty">正在加载...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">添加作品</h2>
        <button class="modal-close" id="modalClose" type="button" aria-label="关闭弹窗">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <form id="modalForm">
        <input type="hidden" id="editId" />

        <section class="form-section" aria-label="基本信息">
          <h3 class="form-section-title">基本信息</h3>
          <div class="form-grid">
            <div class="form-group form-cat">
              <span class="form-label">类别 <span class="required">*</span></span>
              <div class="cat-options" role="radiogroup" aria-label="类别">
                <button type="button" class="cat-option active" data-value="music" aria-pressed="true">音乐</button>
                <button type="button" class="cat-option" data-value="movie" aria-pressed="false">电影</button>
                <button type="button" class="cat-option" data-value="tv" aria-pressed="false">电视剧</button>
                <button type="button" class="cat-option" data-value="books" aria-pressed="false">书籍</button>
                <button type="button" class="cat-option" data-value="images" aria-pressed="false">图片</button>
                <button type="button" class="cat-option" data-value="articles" aria-pressed="false">文章</button>
              </div>
              <select id="mCat" hidden>
                <option value="music">音乐</option>
                <option value="movie">电影</option>
                <option value="tv">电视剧</option>
                <option value="books">书籍</option>
                <option value="images">图片</option>
                <option value="articles">文章</option>
              </select>
            </div>
            <div class="form-group form-title">
              <label for="mTitle">标题 <span class="required">*</span></label>
              <div class="autofill-title-row">
                <input type="text" id="mTitle" required autocomplete="off" />
                <button class="btn-autofill" id="btnAutofill" type="button">
                  <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
                  <span>一键填充</span>
                </button>
              </div>
              <p class="autofill-status" id="autofillStatus" aria-live="polite">输入标题或识别线索后可自动识别作者、描述、标签和年份。</p>
            </div>
            <div class="form-group form-clue">
              <label for="mClue">识别线索</label>
              <input type="text" id="mClue" placeholder="如：韩国特工伪装成家庭 / 画着巨大海浪的日本版画" autocomplete="off" />
            </div>
          </div>
          <div class="autofill-panel" id="autofillPanel" hidden></div>
        </section>

        <section class="form-section" aria-label="详细信息">
          <h3 class="form-section-title">详细信息</h3>
          <div class="form-grid">
            <div class="form-group form-artist">
              <label for="mArtist">艺术家 / 作者 / 导演</label>
              <input type="text" id="mArtist" autocomplete="off" />
            </div>
            <div class="form-group form-cover">
              <label for="mCover">封面图片 URL</label>
              <input type="url" id="mCover" placeholder="https://..." />
            </div>
            <div class="form-group form-desc">
              <label for="mDesc">描述</label>
              <input type="text" id="mDesc" autocomplete="off" />
            </div>
            <div class="form-group form-tags">
              <label for="mTags">标签</label>
              <input type="text" id="mTags" placeholder="科幻, 经典, 想重看" autocomplete="off" />
            </div>
            <div class="form-group form-year">
              <label for="mYear">年份</label>
              <input type="text" id="mYear" maxlength="24" placeholder="如 1889 / 19世纪 / 约1830" />
            </div>
            <div class="form-group form-rating">
              <label for="mRating">推荐程度</label>
              <input type="number" id="mRating" min="1" max="5" step="0.5" value="4" inputmode="decimal" />
            </div>
            <div class="form-group form-duration" id="durationGroup" hidden>
              <label for="mDuration">音乐时长</label>
              <input type="text" id="mDuration" maxlength="24" placeholder="如 3:45 / 04:12" autocomplete="off" />
            </div>
            <div class="form-group form-song-id" id="songIdGroup" hidden>
              <label for="mSongId">网易云歌曲 ID</label>
              <input type="text" id="mSongId" maxlength="32" inputmode="numeric" placeholder="如 19572271" autocomplete="off" />
            </div>
            <div class="form-group form-link">
              <label for="mLink">链接</label>
              <input type="url" id="mLink" placeholder="https://..." />
            </div>
          </div>
        </section>

        <div class="modal-footer">
          <button class="btn-cancel" id="modalCancel" type="button">取消</button>
          <button type="submit" class="btn-submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <input type="file" id="importFile" accept=".json" hidden />

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../collection/js/firebase-config.js"></script>
  <script src="../collection/js/shared.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>音乐 · Xiao Xi 收藏夹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/common.css" />
</head>
<body class="collection-page page-music" data-collection-page="music">
  <div class="music-fluid-bg" aria-hidden="true">
    <div class="music-fluid-layer" id="musicFluidLayerA">
      <div class="fluid-orb fluid-orb-1"></div>
      <div class="fluid-orb fluid-orb-2"></div>
      <div class="fluid-orb fluid-orb-3"></div>
    </div>
    <div class="music-fluid-layer" id="musicFluidLayerB">
      <div class="fluid-orb fluid-orb-1"></div>
      <div class="fluid-orb fluid-orb-2"></div>
      <div class="fluid-orb fluid-orb-3"></div>
    </div>
    <div class="music-fluid-veil"></div>
  </div>
  <div id="siteNav"></div>

  <main class="music-page-shell">
    <section class="music-spotlight" id="musicFeature" data-page-loading="music">
      <p class="collection-empty">加载中...</p>
    </section>
    <section class="music-queue" id="musicQueue"></section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/list-loader.js"></script>
  <script src="js/common.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>影视 · Xiao Xi 收藏夹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/common.css" />
</head>
<body class="collection-page page-film" data-collection-page="film">
  <div id="siteNav"></div>

  <main class="film-page-shell">
    <header class="page-heading">
      <p class="page-kicker">Cinema / Series</p>
      <h1>影视</h1>
      <p>电影和电视剧在数据库里分开存放，这里合并成一个观看清单。</p>
    </header>
    <section class="film-columns">
      <div>
        <h2>电影</h2>
        <div class="film-list" id="movieList" data-page-loading="film"><p class="collection-empty">加载中...</p></div>
      </div>
      <div>
        <h2>电视剧</h2>
        <div class="film-list" id="tvList"><p class="collection-empty">加载中...</p></div>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/list-loader.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
